name: GSCA fixed indicator nested shards
on:
  push:
    branches: [research/oob-correction-20261106]
    paths: ['.github/workflows/gsca-indicator-sharded.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
      - name: Verify identical numerical results after splitting replications
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('research'); test_gsca_fit; test_gsca_risk_maps; test_gsca_predictive; test_gsca_indicator_maps; test_gsca_indicator_predictive; test_indicator_shards;
      - name: Verify merged summaries against unsharded MATLAB results
        run: |
          python -m py_compile research/collect_indicator_results.py
          python research/collect_indicator_results.py --check-shard-fixture research/results_indicator/shard_validation
  stop_superseded_nested_jobs:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Preserve completed primary jobs and stop superseded nested work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh run view 42336898888 --repo PsycheMatrica/GSCA.Reg_Prime --json status --jq .status)
          if [ "$status" != "completed" ]; then
            gh run cancel 42336898888 --repo PsycheMatrica/GSCA.Reg_Prime
          fi
  simulate:
    needs: [validate, stop_superseded_nested_jobs]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        experiment:
          - nested_n80_sample_boundary_part1
          - nested_n80_sample_boundary_part2
          - nested_n80_sample_boundary_part3
          - nested_n80_sample_boundary_part4
          - nested_n80_sample_positive_part1
          - nested_n80_sample_positive_part2
          - nested_n80_sample_positive_part3
          - nested_n80_sample_positive_part4
          - nested_n80_oracle_boundary_part1
          - nested_n80_oracle_boundary_part2
          - nested_n80_oracle_boundary_part3
          - nested_n80_oracle_boundary_part4
          - nested_n200_hetero_sample_boundary_part1
          - nested_n200_hetero_sample_boundary_part2
          - nested_n200_hetero_sample_boundary_part3
          - nested_n200_hetero_sample_boundary_part4
          - nested_n80_sample_boundary_inner199_part1
          - nested_n80_sample_boundary_inner199_part2
          - nested_n80_sample_boundary_inner199_part3
          - nested_n80_sample_boundary_inner199_part4
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
      - name: Run a fixed set of original dataset replications
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('research'); run_indicator_experiment('${{ matrix.experiment }}');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gsca-indicator-shard-${{ matrix.experiment }}
          path: research/results_indicator/
          if-no-files-found: error

