name: GSCA correction research
on:
  push:
    branches: [research/oob-correction-20261106]
    paths: ['research/**', '.github/workflows/gsca-correction.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matlab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
      - name: Independent algebra and implementation checks
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('research'); test_gsca_fit; test_gsca_risk_maps; test_gsca_predictive;
      - name: Moderate correction pilot
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('research'); R=Run_Simulation_Correction_v3('ci'); fprintf('JSON_SUMMARY_BEGIN\\n'); disp(jsonencode(table2struct(R.Summary))); fprintf('JSON_SUMMARY_END\\n');
      - name: Preserve results and seeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsca-correction-results
          path: research/results/
          if-no-files-found: ignore
