name: GSCA correction research
on:
  push:
    branches: [research/oob-correction-20261106]
    paths: ['research/*.m', '.github/workflows/gsca-correction.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matlab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        experiment: [primary, sensitivity, nested_boundary, nested_positive]
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
      - name: Independent algebra and implementation checks
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('research'); test_gsca_fit; test_gsca_risk_maps; test_gsca_predictive;
      - name: Run bounded research experiment
        if: contains(github.event.head_commit.message, '[run-study]') || github.event_name == 'workflow_dispatch'
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('research'); run_research_experiment('${{ matrix.experiment }}');
      - name: Preserve results and seeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsca-correction-${{ matrix.experiment }}
          path: research/results/
          if-no-files-found: ignore
